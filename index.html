<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場結構劣化巡檢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 JSZip 用於打包照片與報表 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- 頂部專案資訊列 -->
  <header class="bg-slate-800 text-white p-3 flex flex-wrap items-center justify-between gap-2 shadow">
    <div class="flex items-center gap-2">
      <span class="font-bold text-lg">🏗️ 劣化巡檢助手</span>
      <input type="text" id="projectName" placeholder="輸入案件名稱 (如: 台北大樓)" class="text-black px-2 py-1 rounded text-sm w-40" value="案件A">
      <input type="date" id="inspectDate" class="text-black px-2 py-1 rounded text-sm">
    </div>
    <div class="flex items-center gap-2">
      <label class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-sm cursor-pointer">
        📂 載入平面圖
        <input type="file" id="planUpload" accept="image/*" class="hidden">
      </label>
      <button onclick="exportAll()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-sm font-bold">
        📦 匯出全部資料 (ZIP)
      </button>
    </div>
  </header>

  <!-- 主工作區：左側平面圖，右側記錄表單 -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- 左側：互動式平面圖標註區 -->
    <div class="w-full md:w-3/5 bg-gray-300 relative flex items-center justify-center overflow-auto border-b md:border-b-0 md:border-r border-gray-400" id="canvasContainer">
      <p id="placeholderText" class="text-gray-600 font-medium">請先點擊上方「載入平面圖」上傳底圖，再點擊圖面標註位置</p>
      <canvas id="planCanvas" class="hidden shadow-lg cursor-crosshair bg-white"></canvas>
    </div>

    <!-- 右側：資料填寫與紀錄列表 -->
    <div class="w-full md:w-2/5 bg-white flex flex-col h-full overflow-hidden">
      
      <!-- 當前點位編輯表單 -->
      <div class="p-4 border-b border-gray-200 overflow-y-auto flex-1" id="editorPanel">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-lg text-slate-700">當前點位：<span id="currentPointLabel" class="text-blue-600">尚未選取</span></h2>
          <button onclick="deleteCurrentPoint()" id="deleteBtn" class="hidden text-red-500 text-sm underline">刪除此點</button>
        </div>

        <div id="formFields" class="space-y-3 opacity-50 pointer-events-none">
          <!-- 拍照方向調整滑桿 -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">拍攝方向角度 (<span id="angleVal">0</span>°)</label>
            <input type="range" id="angleSlider" min="0" max="360" value="0" class="w-full">
          </div>

          <!-- 拍照按鈕 -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">現場拍照 (自動命名)</label>
            <div class="flex items-center gap-3">
              <label class="bg-indigo-600 text-white px-4 py-2 rounded text-sm cursor-pointer shadow">
                📷 拍攝 / 選取照片
                <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
              </label>
              <span id="photoStatus" class="text-xs text-gray-500">尚未拍照</span>
            </div>
            <img id="photoPreview" class="mt-2 max-h-32 rounded border hidden">
          </div>

          <!-- 樓層與位置 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">樓層</label>
              <input type="text" id="floorInput" placeholder="如: PR, 1F, 2F" class="w-full border rounded p-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">位置 (構件)</label>
              <select id="locationSelect" class="w-full border rounded p-1.5 text-sm">
                <option value="柱">柱</option>
                <option value="牆">牆</option>
                <option value="梁">梁</option>
                <option value="樓板">樓板</option>
                <option value="樓梯板">樓梯板</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <!-- 劣損類型 (對應你的表格) -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">劣損類型 (可複選)</label>
            <div class="grid grid-cols-2 gap-1.5 text-xs bg-gray-50 p-2 rounded border">
              <div class="col-span-2 mb-1">
                <select id="typeSelect" class="w-full border rounded p-1 text-sm">
                  <option value="">-- 選擇裂縫/剝落 Type --</option>
                  <option value="Type A">Type A: 裂縫<0.3mm RC構材</option>
                  <option value="Type B">Type B: 裂縫>=0.3mm RC構材</option>
                  <option value="Type C">Type C: 剝落深度<25mm RC構材</option>
                  <option value="Type D">Type D: 剝落深度>=25mm RC構材</option>
                  <option value="Type E">Type E: RC構材白華</option>
                  <option value="Type F">Type F: 裂縫<0.5mm 磚牆</option>
                  <option value="Type G">Type G: 裂縫>=0.5mm 磚牆</option>
                  <option value="Type H">Type H: 磚牆白華</option>
                </select>
              </div>
              <label><input type="checkbox" class="defect-chk" value="鋼筋外露"> 鋼筋外露</label>
              <label><input type="checkbox" class="defect-chk" value="鋼筋鏽蝕"> 鋼筋鏽蝕</label>
              <label><input type="checkbox" class="defect-chk" value="油漆剝落"> 油漆剝落</label>
              <label><input type="checkbox" class="defect-chk" value="粉刷層剝落"> 粉刷層剝落</label>
              <label><input type="checkbox" class="defect-chk" value="磁磚剝落"> 磁磚剝落</label>
              <label><input type="checkbox" class="defect-chk" value="滲水"> 滲水</label>
              <label><input type="checkbox" class="defect-chk" value="其他"> 其他</label>
            </div>
          </div>

          <!-- 數量與說明 -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">劣損數量與補充說明</label>
            <input type="text" id="quantityInput" placeholder="如: 15 m² 或 3 m" class="w-full border rounded p-1.5 text-sm">
          </div>
        </div>
      </div>

      <!-- 底部已紀錄點位快速切換列 -->
      <div class="h-32 bg-slate-50 border-t border-gray-300 p-2 overflow-y-auto">
        <div class="text-xs font-bold text-gray-500 mb-1">已標註點位清單 (點擊切換)：</div>
        <div id="pointList" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>
  </main>

  <script>
    // 初始化日期為今天
    document.getElementById('inspectDate').valueAsDate = new Date();

    const canvas = document.getElementById('planCanvas');
    const ctx = canvas.getContext('2d');
    let bgImage = null;
    let points = []; // 儲存所有點位資料
    let selectedIndex = -1;

    // 1. 載入平面圖
    document.getElementById('planUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        bgImage = new Image();
        bgImage.onload = function() {
          canvas.width = bgImage.width;
          canvas.height = bgImage.height;
          canvas.classList.remove('hidden');
          document.getElementById('placeholderText').classList.add('hidden');
          drawCanvas();
        }
        bgImage.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    // 2. 點擊平面圖新增標註點
    canvas.addEventListener('click', function(e) {
      if (!bgImage) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      // 檢查是否點到既有標註點 (半徑 30px 內)
      const clickedIdx = points.findIndex(p => Math.hypot(p.x - x, p.y - y) < 35);
      if (clickedIdx !== -1) {
        selectPoint(clickedIdx);
        return;
      }

      // 新增點位
      const newPoint = {
        id: points.length + 1,
        x: x,
        y: y,
        angle: 0,
        floor: points.length > 0 ? points[points.length - 1].floor : '', // 自動帶入上一筆樓層
        location: '牆',
        type: '',
        defects: [],
        quantity: '',
        photoData: null
      };
      points.push(newPoint);
      selectPoint(points.length - 1);
      drawCanvas();
    });

    // 3. 繪製平面圖與所有編號箭頭
    function drawCanvas() {
      if (!bgImage) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bgImage, 0, 0);

      points.forEach((p, idx) => {
        const isSelected = idx === selectedIndex;
        const label = String(idx + 1).padStart(3, '0');
        const rad = (p.angle - 90) * Math.PI / 180; // 0度朝上

        ctx.save();
        ctx.translate(p.x, p.y);

        // 畫方向箭頭
        ctx.save();
        ctx.rotate(rad);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(45, 0);
        ctx.lineTo(35, -10);
        ctx.moveTo(45, 0);
        ctx.lineTo(35, 10);
        ctx.strokeStyle = isSelected ? '#dc2626' : '#2563eb';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.restore();

        // 畫圓圈底色
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#dc2626' : '#2563eb';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // 畫流水號文字 (001)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, 0, 0);

        ctx.restore();
      });
      updatePointListUI();
    }

    // 4. 選取點位並載入表單資料
    function selectPoint(idx) {
      selectedIndex = idx;
      const p = points[idx];
      const label = String(idx + 1).padStart(3, '0');

      document.getElementById('currentPointLabel').innerText = `#${label}`;
      document.getElementById('formFields').classList.remove('opacity-50', 'pointer-events-none');
      document.getElementById('deleteBtn').classList.remove('hidden');

      document.getElementById('angleSlider').value = p.angle;
      document.getElementById('angleVal').innerText = p.angle;
      document.getElementById('floorInput').value = p.floor;
      document.getElementById('locationSelect').value = p.location;
      document.getElementById('typeSelect').value = p.type;
      document.getElementById('quantityInput').value = p.quantity;

      document.querySelectorAll('.defect-chk').forEach(chk => {
        chk.checked = p.defects.includes(chk.value);
      });

      const preview = document.getElementById('photoPreview');
      if (p.photoData) {
        preview.src = p.photoData;
        preview.classList.remove('hidden');
        document.getElementById('photoStatus').innerText = '已拍攝照片';
      } else {
        preview.classList.add('hidden');
        document.getElementById('photoStatus').innerText = '尚未拍照';
      }
      drawCanvas();
    }

    // 監聽表單變動即時儲存
    document.getElementById('angleSlider').addEventListener('input', e => {
      if (selectedIndex === -1) return;
      points[selectedIndex].angle = parseInt(e.target.value);
      document.getElementById('angleVal').innerText = e.target.value;
      drawCanvas();
    });

    ['floorInput', 'locationSelect', 'typeSelect', 'quantityInput'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (selectedIndex === -1) return;
        const p = points[selectedIndex];
        p.floor = document.getElementById('floorInput').value;
        p.location = document.getElementById('locationSelect').value;
        p.type = document.getElementById('typeSelect').value;
        p.quantity = document.getElementById('quantityInput').value;
        updatePointListUI();
      });
    });

    document.querySelectorAll('.defect-chk').forEach(chk => {
      chk.addEventListener('change', () => {
        if (selectedIndex === -1) return;
        const checked = Array.from(document.querySelectorAll('.defect-chk:checked')).map(c => c.value);
        points[selectedIndex].defects = checked;
      });
    });

    // 5. 處理現場拍照
    document.getElementById('photoInput').addEventListener('change', function(e) {
      if (selectedIndex === -1 || !e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        points[selectedIndex].photoData = event.target.result;
        document.getElementById('photoPreview').src = event.target.result;
        document.getElementById('photoPreview').classList.remove('hidden');
        document.getElementById('photoStatus').innerText = '已拍攝照片';
        updatePointListUI();
      }
      reader.readAsDataURL(e.target.files[0]);
    });

    function deleteCurrentPoint() {
      if (selectedIndex === -1) return;
      points.splice(selectedIndex, 1);
      selectedIndex = -1;
      document.getElementById('currentPointLabel').innerText = '尚未選取';
      document.getElementById('formFields').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('deleteBtn').classList.add('hidden');
      drawCanvas();
    }

    function updatePointListUI() {
      const list = document.getElementById('pointList');
      list.innerHTML = '';
      points.forEach((p, idx) => {
        const label = String(idx + 1).padStart(3, '0');
        const btn = document.createElement('button');
        btn.className = `px-2.5 py-1 rounded text-xs font-bold border ${idx === selectedIndex ? 'bg-red-600 text-white' : 'bg-white text-gray-700'}`;
        btn.innerText = `${label} (${p.floor || '?'}-${p.location}) ${p.photoData ? '📷' : ''}`;
        btn.onclick = () => selectPoint(idx);
        list.appendChild(btn);
      });
    }

    // 6. 一鍵打包匯出 (重新命名照片 + 標註平面圖 + CSV表格)
    async function exportAll() {
      if (points.length === 0) {
        alert('目前沒有任何標註資料！');
        return;
      }
      const zip = new JSZip();
      const dateStr = document.getElementById('inspectDate').value.replace(/-/g, '');
      const projName = document.getElementById('projectName').value || 'Project';
      const prefix = `${dateStr}_${projName}`;

      // 匯出畫好標記的平面圖
      selectedIndex = -1; // 取消紅色選取狀態以統一顏色匯出
      drawCanvas();
      const planDataUrl = canvas.toDataURL('image/png');
      zip.file(`${prefix}_標註平面圖.png`, planDataUrl.split(',')[1], {base64: true});

      // 建立 CSV 表格內容 (加上 BOM 確保 Excel 開啟中文不亂碼)
      let csvContent = "\uFEFF照片編號,檔案名稱,樓層,位置,TYPE,其他劣損類型,劣損數量與補充說明\n";
      const photoFolder = zip.folder("現場照片");

      points.forEach((p, idx) => {
        const seq = String(idx + 1).padStart(3, '0');
        const fileName = `${prefix}_${seq}.jpg`;
        
        // 寫入 CSV
        const defectsStr = p.defects.join('、');
        csvContent += `${seq},${fileName},"${p.floor}","${p.location}","${p.type}","${defectsStr}","${p.quantity}"\n`;

        // 存入重新命名的照片
        if (p.photoData) {
          photoFolder.file(fileName, p.photoData.split(',')[1], {base64: true});
        }
      });

      zip.file(`${prefix}_劣化紀錄表.csv`, csvContent);

      // 下載 ZIP
      const content = await zip.generateAsync({type: "blob"});
      saveAs(content, `${prefix}_巡檢成果.zip`);
    }
  </script>
</body>
</html>
