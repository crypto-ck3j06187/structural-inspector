<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場結構劣化巡檢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js 用於解析 PDF 平面圖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- JSZip & FileSaver 用於打包匯出 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    /* 禁止瀏覽器預設的雙指縮放與下拉重整，交由 Canvas 接管手勢 */
    #viewport { touch-action: none; }
  </style>
</head>
<body class="bg-gray-900 text-gray-800 h-[100dvh] flex flex-col overflow-hidden select-none">

  <!-- 頂部專案資訊列 -->
  <header class="bg-slate-800 text-white px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow z-20">
    <div class="flex items-center gap-1.5">
      <span class="font-bold text-base">🏗️ 劣化巡檢</span>
      <input type="text" id="projectName" placeholder="案件名稱" class="text-black px-2 py-1 rounded text-xs w-28" value="案件A">
      <input type="date" id="inspectDate" class="text-black px-1.5 py-1 rounded text-xs w-28">
    </div>
    <div class="flex items-center gap-1.5">
      <label class="bg-blue-600 active:bg-blue-500 px-2.5 py-1.5 rounded text-xs font-bold cursor-pointer shadow">
        📂 載入PDF/圖
        <input type="file" id="planUpload" accept="application/pdf,image/*" class="hidden">
      </label>
      <button onclick="exportAll()" class="bg-emerald-600 active:bg-emerald-500 px-2.5 py-1.5 rounded text-xs font-bold shadow">
        📦 匯出ZIP
      </button>
    </div>
  </header>

  <!-- PDF 頁數切換列 (僅在載入多頁 PDF 時顯示) -->
  <div id="pdfPageBar" class="hidden bg-slate-700 text-white px-3 py-1.5 flex items-center justify-between text-xs z-20 border-t border-slate-600">
    <div class="flex items-center gap-2">
      <button onclick="changePdfPage(-1)" class="bg-slate-600 px-2.5 py-1 rounded font-bold">◀ 上一頁</button>
      <span id="pageIndicator" class="font-bold">第 1 / 1 頁</span>
      <button onclick="changePdfPage(1)" class="bg-slate-600 px-2.5 py-1 rounded font-bold">下一頁 ▶</button>
    </div>
    <span class="text-gray-300 text-[11px]">雙指縮放 / 單指拖曳 / 點擊標註</span>
  </div>

  <!-- 主工作區 -->
  <main class="flex-1 relative flex flex-col md:flex-row overflow-hidden">
    
    <!-- 互動式平面圖檢視區 (支援縮放與平移) -->
    <div id="viewport" class="flex-1 bg-gray-800 relative overflow-hidden flex items-center justify-center">
      <p id="placeholderText" class="text-gray-400 text-sm px-6 text-center leading-relaxed">
        請點擊右上角「📂 載入PDF/圖」<br>載入平面圖後，支援雙指縮放與單指拖曳<br>點擊圖面即可新增編號與拍照方向
      </p>
      <canvas id="planCanvas" class="hidden origin-top-left"></canvas>

      <!-- 浮動縮放控制鈕 (方便單手操作) -->
      <div id="zoomControls" class="hidden absolute top-3 left-3 flex flex-col gap-1.5 z-10">
        <button onclick="zoomBy(1.3)" class="w-9 h-9 bg-white/90 text-gray-800 rounded-full shadow-lg font-bold text-lg flex items-center justify-center active:bg-gray-200">+</button>
        <button onclick="zoomBy(0.75)" class="w-9 h-9 bg-white/90 text-gray-800 rounded-full shadow-lg font-bold text-lg flex items-center justify-center active:bg-gray-200">-</button>
        <button onclick="fitToScreen()" class="w-9 h-9 bg-white/90 text-gray-800 rounded-full shadow-lg font-bold text-xs flex items-center justify-center active:bg-gray-200">全圖</button>
      </div>

      <!-- 浮動點位快速切換膠囊列 -->
      <div id="floatingListWrapper" class="hidden absolute bottom-2 left-2 right-2 bg-black/60 backdrop-blur-sm p-1.5 rounded-lg z-10">
        <div id="pointList" class="flex gap-1.5 overflow-x-auto pb-0.5"></div>
      </div>
    </div>

    <!-- 紀錄表單面板 (手機版為底部抽屜，平板/電腦版為右側固定欄) -->
    <div id="editorDrawer" class="fixed md:static inset-x-0 bottom-0 z-30 bg-white rounded-t-2xl md:rounded-none shadow-2xl md:shadow-none md:w-[400px] border-t md:border-t-0 md:border-l border-gray-300 transition-transform duration-300 translate-y-full md:translate-y-0 flex flex-col max-h-[82dvh] md:max-h-full">
      
      <!-- 抽屜標題列 -->
      <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-slate-50 rounded-t-2xl md:rounded-none">
        <div class="flex items-center gap-2">
          <span class="font-bold text-base text-slate-800">點位：<span id="currentPointLabel" class="text-blue-600">尚未選取</span></span>
          <button onclick="deleteCurrentPoint()" id="deleteBtn" class="hidden text-red-500 text-xs border border-red-200 bg-red-50 px-2 py-0.5 rounded">刪除</button>
        </div>
        <!-- 手機版收起按鈕 -->
        <button onclick="closeDrawer()" class="md:hidden bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold">
          完成 / 收起 ▾
        </button>
      </div>

      <!-- 表單內容捲動區 -->
      <div id="formFields" class="p-4 space-y-3.5 overflow-y-auto flex-1 opacity-50 pointer-events-none">
        
        <!-- 1. 拍照方向角度 -->
        <div class="bg-blue-50/70 p-2.5 rounded-lg border border-blue-100">
          <div class="flex justify-between text-xs font-bold text-blue-900 mb-1">
            <span>🧭 拍攝方向角度 (即時旋轉箭頭)</span>
            <span><span id="angleVal">0</span>°</span>
          </div>
          <input type="range" id="angleSlider" min="0" max="360
